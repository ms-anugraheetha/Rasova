server {

    listen 80;

    index index.php index.html;

    server_name localhost;

    root /var/www/public;

    client_max_body_size 10M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Long cache lifetime for static assets — these don't change often, and
    # when they do (e.g. replacing a product photo), the browser will pick
    # up the new version once its cache naturally expires or on a hard refresh.
    location ~* \.(jpg|jpeg|png|webp|gif|svg|ico|css|js|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {

        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_index index.php;
        fastcgi_read_timeout 300;
    }

    location ~ /\.ht {
        deny all;
    }

    gzip on;
gzip_vary on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 256;

}