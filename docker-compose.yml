version: "3.9"

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: rasova_app

    working_dir: /var/www

    volumes:
      - ./:/var/www

    depends_on:
      - postgres

  nginx:

    image: nginx:latest

    container_name: rasova_nginx

    ports:
      - "8000:80"

    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

  postgres:

    image: postgres:17

    container_name: rasova_postgres

    restart: always

    environment:
      POSTGRES_DB: rasova
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:

  postgres_data: